# TODO: 按需调整内存/并行配置。configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 1.21.1 线（RS2 2.x 的对应版本）
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.116.17+1.21.1

# Refined Storage 2.x：support/2.x 分支最新发布版本，发布在 maven.creeperhost.net
refinedstorage_version=2.0.9
# RS2 运行期依赖（仅 dev 运行需要显式声明，正式环境由 RS2 的嵌套 jar 提供）
cloth_config_version=15.0.140
energy_version=4.1.0
# 石英兵工厂（石英终端/无线合成终端），Fabric 版发布在 Modrinth maven
quartz_arsenal_version=1.0.8
# RS2 官方的 EMI 集成桥：样板终端的 EMI 拖拽靠它注册。
emi_integration_version=1.0.0
# EMI 本体：由上面的集成桥传递依赖引入运行期，编译期需要它来写 handler。
emi_version=1.1.22+1.21.1

